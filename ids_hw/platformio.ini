[platformio]
src_dir = .

; ── ESP32-C3 SuperMini — LUT-KAN inference ───────────────────────────
; Model stored in PROGMEM (Flash), <512 B SRAM at runtime.
; Build after: python scripts/export_lut_c_header.py ...
;
[env:esp32_lut_kan]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_src_filter = +<ids_esp32_lut_kan/*>
build_flags   =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O3
    -std=gnu++17
    -funroll-loops

[env:mega_lut_kan]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_speed  = 115200
build_flags   = -O2 -ffast-math
build_src_filter = +<ids_mega_lut_kan/*>
